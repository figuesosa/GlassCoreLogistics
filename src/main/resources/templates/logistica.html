<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments :: head('Logística')}"></head>
<body>
<header th:replace="~{fragments :: top('logistica')}"></header>
<main class="page">
    <div th:replace="~{fragments :: flashes}"></div>
    <h1 class="page-title">Logística</h1>
    <p class="lead">Ruta fija Tegucigalpa-Comayagua. 85 km sencillo, 170 km redondo. 0.12 L/km a Lps 32.50.</p>

    <section class="card">
        <h2>Vehículo</h2>
        <form th:action="@{/logistica/vehiculo}" method="post" class="form-grid">
            <label>ID para actualizar <input name="id" type="number" placeholder="vacío = nuevo"></label>
            <label>Placa <input name="placa" required></label>
            <label>Marca <input name="marca" required></label>
            <label>Km actual <input name="kmActual" required></label>
            <label>Km límite mant. <input name="kmLimite" required></label>
            <label>Chofer
                <select name="choferId">
                    <option value="">— sin chofer —</option>
                    <option th:each="c : ${choferes}" th:value="${c.id}" th:text="${c.nombreCompleto}"></option>
                </select>
            </label>
            <button class="btn btn-primary" type="submit">Guardar vehículo</button>
        </form>
        <div class="table-wrap" style="margin-top:1rem">
            <table>
                <thead>
                <tr><th>ID</th><th>Placa</th><th>Marca</th><th>Km</th><th>Límite</th><th>Chofer</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="v : ${vehiculos}">
                    <td th:text="${v.id}"></td>
                    <td th:text="${v.placa}"></td>
                    <td th:text="${v.marca}"></td>
                    <td th:text="${v.kmActual}"></td>
                    <td th:text="${v.kmLimiteMantenimiento}"></td>
                    <td th:text="${v.choferNombre} ?: '—'"></td>
                    <td>
                        <form th:action="@{/logistica/vehiculo/borrar}" method="post">
                            <input type="hidden" name="id" th:value="${v.id}">
                            <button class="btn btn-danger" type="submit">Borrar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="card">
        <h2>Autorizar salida</h2>
        <p th:if="${calc}">
            Cálculo:
            <strong th:text="${calc.kilometros} + ' km'"></strong> ·
            <span th:text="${#numbers.formatDecimal(calc.litros,1,3)} + ' L'"></span> ·
            <span th:text="'Lps ' + ${#numbers.formatDecimal(calc.gastoLps,1,2)}"></span>
        </p>
        <form method="get" th:action="@{/logistica}" class="form-grid">
            <label class="check">
                <input type="checkbox" name="redondo" value="true" th:checked="${redondo}">
                Viaje redondo (170 km)
            </label>
            <button class="btn btn-ghost" type="submit">Recalcular</button>
        </form>
        <form th:action="@{/logistica/autorizar}" method="post" class="form-grid">
            <input type="hidden" name="redondo" th:value="${redondo}">
            <label>Vehículo
                <select name="vehiculoId" required>
                    <option th:each="v : ${vehiculos}" th:value="${v.id}"
                            th:text="${v.placa} + ' · ' + ${v.marca} + ' (km ' + ${v.kmActual} + ')'"></option>
                </select>
            </label>
            <button class="btn btn-danger" type="submit">Autorizar salida</button>
        </form>
    </section>

    <section class="card">
        <h2>Viajes</h2>
        <form method="get" th:action="@{/reportes/hoja-ruta}" class="form-grid" target="_blank">
            <label>Hoja de ruta Jasper
                <select name="viajeId" required>
                    <option th:each="vi : ${viajes}" th:value="${vi.id}"
                            th:text="'#' + ${vi.id} + ' · ' + ${vi.placa} + ' · ' + ${vi.ruta}"></option>
                </select>
            </label>
            <button class="btn btn-primary" type="submit">Abrir PDF</button>
        </form>
        <div class="table-wrap" style="margin-top:1rem">
            <table>
                <thead>
                <tr><th>ID</th><th>Placa</th><th>Chofer</th><th>Ruta</th><th>Km</th><th>Litros</th><th>Gasto</th><th>Fecha</th></tr>
                </thead>
                <tbody>
                <tr th:each="vi : ${viajes}">
                    <td th:text="${vi.id}"></td>
                    <td th:text="${vi.placa}"></td>
                    <td th:text="${vi.choferNombre}"></td>
                    <td th:text="${vi.ruta}"></td>
                    <td th:text="${vi.kilometros}"></td>
                    <td th:text="${#numbers.formatDecimal(vi.litrosEstimados,1,3)}"></td>
                    <td th:text="${#numbers.formatDecimal(vi.gastoCombustible,1,2)}"></td>
                    <td th:text="${vi.fechaSalida}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
