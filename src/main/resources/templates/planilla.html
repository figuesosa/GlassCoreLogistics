<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments :: head('Planilla')}"></head>
<body>
<header th:replace="~{fragments :: top('planilla')}"></header>
<main class="page">
    <div th:replace="~{fragments :: flashes}"></div>
    <h1 class="page-title">Empleados y planilla</h1>
    <p class="lead">Neto = salario de la base + extras + viáticos. El PDF pide una planilla ya cerrada.</p>

    <div class="grid-2">
        <section class="card">
            <h2 data-form-title data-new-label="Registrar empleado" data-edit-label="Editar empleado">Registrar empleado</h2>
            <form id="form-empleado" th:action="@{/planilla/empleado}" method="post" class="form-grid two">
                <input type="hidden" name="id">
                <label>Nombre <input name="nombre" required></label>
                <label>Apellido <input name="apellido" required></label>
                <label>Cargo
                    <select name="cargo">
                        <option th:each="c : ${cargos}" th:text="${c}" th:value="${c}"></option>
                    </select>
                </label>
                <label>Salario base <input name="salarioBase" required></label>
                <label>Teléfono <input name="telefono"></label>
                <div class="form-actions span-2">
                    <button class="btn btn-primary" type="submit">Guardar empleado</button>
                    <button class="btn btn-muted" type="button" data-reset-form="#form-empleado" hidden>Cancelar edición</button>
                </div>
            </form>
        </section>
        <section class="card">
            <h2>Cerrar planilla / comprobante</h2>
            <form th:action="@{/planilla/cerrar}" method="post" class="form-grid">
                <label>Empleado
                    <select name="empleadoId" required>
                        <option th:each="e : ${empleados}" th:value="${e.id}"
                                th:text="${e.nombreCompleto} + ' · Lps ' + ${#numbers.formatDecimal(e.salarioBase,1,2)}"></option>
                    </select>
                </label>
                <label>Horas extras (Lps) <input name="horasExtras" value="0"></label>
                <label>Viáticos (Lps) <input name="viaticos" value="0"></label>
                <button class="btn btn-accent" type="submit">Cerrar planilla</button>
            </form>
            <form method="get" th:action="@{/reportes/planilla}" class="form-grid" style="margin-top:1rem" target="_blank">
                <label>Comprobante Jasper
                    <select name="empleadoId" required>
                        <option th:each="e : ${empleados}" th:value="${e.id}"
                                th:text="${e.nombreCompleto}"></option>
                    </select>
                </label>
                <button class="btn btn-primary" type="submit">Abrir PDF</button>
            </form>
        </section>
    </div>

    <section class="card">
        <h2>Personal</h2>
        <input class="table-search" data-table="#tabla-empleados" placeholder="Buscar por nombre, cargo o teléfono">
        <div class="table-wrap">
            <table id="tabla-empleados">
                <thead>
                <tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Cargo</th><th>Salario</th><th>Teléfono</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="e : ${empleados}">
                    <td th:text="${e.id}"></td>
                    <td th:text="${e.nombre}"></td>
                    <td th:text="${e.apellido}"></td>
                    <td th:text="${e.cargo}"></td>
                    <td th:text="${#numbers.formatDecimal(e.salarioBase,1,2)}"></td>
                    <td th:text="${e.telefono}"></td>
                    <td>
                        <div class="row-actions">
                            <button type="button" class="btn btn-accent"
                                    data-edit="#form-empleado"
                                    th:attr="data-id=${e.id},
                                             data-nombre=${e.nombre},
                                             data-apellido=${e.apellido},
                                             data-cargo=${e.cargo},
                                             data-salariobase=${e.salarioBase},
                                             data-telefono=${e.telefono}">Editar</button>
                            <form th:action="@{/planilla/empleado/borrar}" method="post"
                                  th:data-confirm="|¿Seguro que desea desactivar a ${e.nombreCompleto}?|">
                                <input type="hidden" name="id" th:value="${e.id}">
                                <button class="btn btn-danger" type="submit">Desactivar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="card">
        <h2>Histórico de planilla</h2>
        <input class="table-search" data-table="#tabla-planillas" placeholder="Buscar por empleado o fecha">
        <div class="table-wrap">
            <table id="tabla-planillas">
                <thead>
                <tr><th>ID</th><th>Empleado</th><th>Salario</th><th>Extras</th><th>Viáticos</th><th>Neto</th><th>Fecha</th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${planillas}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.empleadoNombre}"></td>
                    <td th:text="${#numbers.formatDecimal(p.salarioBase,1,2)}"></td>
                    <td th:text="${#numbers.formatDecimal(p.horasExtras,1,2)}"></td>
                    <td th:text="${#numbers.formatDecimal(p.viaticos,1,2)}"></td>
                    <td th:text="${#numbers.formatDecimal(p.totalNeto,1,2)}"></td>
                    <td th:text="${p.fechaPago}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
