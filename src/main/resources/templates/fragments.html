<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#273877">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link rel="apple-touch-icon" th:href="@{/icons/icon-192.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <title th:text="${titulo} + ' - GlassCore'">GlassCore</title>
</head>
<body>
<header th:fragment="top(modulo)" class="topbar">
    <a class="brand" th:href="@{/}">
        <img th:src="@{/img/logo.svg}" alt="GlassCore" width="36" height="36">
        <span>GlassCore</span>
    </a>
    <nav class="nav">
        <a th:href="@{/}" th:classappend="${modulo=='inicio'} ? ' active'">Inicio</a>
        <a th:href="@{/clientes}" sec:authorize="hasAnyRole('ADMIN','CAJERO')"
           th:classappend="${modulo=='clientes'} ? ' active'">Clientes</a>
        <a th:href="@{/cotizaciones}" sec:authorize="hasAnyRole('ADMIN','CAJERO')"
           th:classappend="${modulo=='cotizaciones'} ? ' active'">Cotizaciones</a>
        <a th:href="@{/ventas}" sec:authorize="hasAnyRole('ADMIN','CAJERO','CONTADOR')"
           th:classappend="${modulo=='ventas'} ? ' active'">Ventas</a>
        <a th:href="@{/proveedores}" sec:authorize="hasRole('ADMIN')"
           th:classappend="${modulo=='proveedores'} ? ' active'">Proveedores</a>
        <a th:href="@{/inventario}" sec:authorize="hasAnyRole('ADMIN','CAJERO','OPERADOR')"
           th:classappend="${modulo=='inventario'} ? ' active'">Inventario</a>
        <a th:href="@{/herramientas}" sec:authorize="hasAnyRole('ADMIN','OPERADOR')"
           th:classappend="${modulo=='herramientas'} ? ' active'">Herramientas</a>
        <a th:href="@{/logistica}" sec:authorize="hasAnyRole('ADMIN','OPERADOR')"
           th:classappend="${modulo=='logistica'} ? ' active'">Logística</a>
        <a th:href="@{/planilla}" sec:authorize="hasAnyRole('ADMIN','CONTADOR')"
           th:classappend="${modulo=='planilla'} ? ' active'">Planilla</a>
        <a th:href="@{/reportes}" sec:authorize="hasAnyRole('ADMIN','CONTADOR')"
           th:classappend="${modulo=='reportes'} ? ' active'">Reportes</a>
        <a th:href="@{/fiscal}" sec:authorize="hasRole('ADMIN')"
           th:classappend="${modulo=='fiscal'} ? ' active'">Fiscal</a>
        <a th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')"
           th:classappend="${modulo=='usuarios'} ? ' active'">Usuarios</a>
    </nav>
    <div class="session">
        <span class="user" sec:authentication="name">usuario</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-ghost">Salir</button>
        </form>
    </div>
</header>
<div th:fragment="flashes">
    <div th:if="${mensaje}" class="flash ok" th:text="${mensaje}"></div>
    <div th:if="${alerta}" class="flash warn" style="white-space:pre-line" th:text="${alerta}"></div>
    <div th:if="${error}" class="flash err" style="white-space:pre-line" th:text="${error}"></div>
</div>
<script th:fragment="scripts" th:src="@{/js/app.js}"></script>
</body>
</html>
